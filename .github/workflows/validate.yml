name: Validate QuoteAI Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile helper script
        run: python -m compileall skills/quote-ai/scripts
      - name: Validate local Agent Skill install
        run: |
          mkdir -p /tmp/quoteai-skill-local
          cd /tmp/quoteai-skill-local
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill quote-ai --agent codex --copy --yes
      - name: Validate public GitHub install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/quoteai-skill-public
          cd /tmp/quoteai-skill-public
          npx --yes skills@latest add "https://github.com/${{ github.repository }}" --skill quote-ai --agent codex --copy --yes
